<!DOCTYPE html>
<html lang="vi">
<head>
    <meta charset="UTF-8">
    <title>Menu đồ ăn</title>

    <style>
        body {
            font-family: Arial, sans-serif;
            background-color: #f5f5f5;
        }

        h1 {
            text-align: center;
            color: #d35400;
            font-size: 36px;
        }

        table {
            width: 90%;
            margin: auto;
            border-collapse: collapse;
            background-color: white;
            font-size: 20px;
        }

        th {
            background-color: #e67e22;
            color: white;
            padding: 15px;
            font-size: 22px;
        }

        td {
            border: 2px solid #ddd;
            padding: 12px;
            text-align: center;
        }

        img {
            width: 150px;
            height: 100px;
            object-fit: cover;
            border-radius: 10px;
        }

        tr:hover {
            background-color: #fff3e0;
        }
    </style>
</head>

<body>

<h1> MENU ĐỒ ĂN </h1>

<table>
    <tr>
        <th>Hình ảnh</th>
        <th>Tên món</th>
        <th>Giá</th>
        <th>Mô tả</th>
    </tr>

    <tr>
        <td>
            <img src="https://images.unsplash.com/photo-1568901346375-23c9450c58cd?auto=format&fit=crop&w=400&q=80">
        </td>
        <td>Hamburger</td>
        <td>35.000đ</td>
        <td>Bánh mì kẹp thịt và rau</td>
    </tr>

    <tr>
        <td>
            <img src="https://images.unsplash.com/photo-1579751626657-72bc17010498?auto=format&fit=crop&w=400&q=80">
        </td>
        <td>Pizza</td>
        <td>60.000đ</td>
        <td>Pizza phô mai thơm ngon</td>
    </tr>

    <tr>
        <td>
            <img src="https://images.unsplash.com/photo-1563379926898-05f4575a45d8?auto=format&fit=crop&w=400&q=80">
        </td>
        <td>Mì Ý</td>
        <td>45.000đ</td>
        <td>Mì Ý sốt cà chua</td>
    </tr>

    <tr>
        <td>
            <img src="https://images.unsplash.com/photo-1547592180-85f173990554?auto=format&fit=crop&w=400&q=80">
        </td>
        <td>Salad</td>
        <td>30.000đ</td>
        <td>Rau củ tươi và nước sốt</td>
    </tr>

</table>

</body>
</html>
